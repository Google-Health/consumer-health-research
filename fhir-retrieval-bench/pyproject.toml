[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fhir_retrieval_bench"
version = "0.1.0"
description = "Evaluation benchmark for clinical RAG and agents over longitudinal FHIR bundles."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "pydantic>=2.5.0,<3.0.0",
    "immutabledict>=4.1.0,<5.0.0",
    "pyyaml>=6.0.1,<7.0.0",
    "absl-py>=2.0.0,<3.0.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "tqdm>=4.66.0,<5.0.0",
    "pyarrow>=18.0.0",
    "google-genai>=0.1.0",
    "litellm>=1.0.0",
    "anthropic>=0.20.0",
    "google-adk>=0.1.0",
    "jinja2>=3.1.2",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["fhir_retrieval_bench*", "ns_agent_adk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["reference_code", "fhir-hopper-env", ".git", ".pytest_cache"]
